[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "ecologi-sdk"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
description = "Ecologi Python SDK"
authors = [
    { name = "Owen Voke", email = "development@voke.dev" }
]
keywords = ["ecologi", "sdk"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.11.0"
dependencies = [
    "requests>=2.28.1"
]

[project.urls]
"Source Code" = "https://github.com/owenvoke/ecologi-python-sdk"
"Issues" = "https://github.com/owenvoke/ecologi-python-sdk/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/docs",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["ecologi"]

[tool.hatch.envs.default]
dependencies = [
    "mypy",
    "pytest==7.1",
    "requests-mock==1.10",
    "ruff==0.17.1",
    "types-requests",
]

[tool.hatch.envs.default.scripts]
test = [
    "mypy ecologi",
    "pytest",
]
lint = [
    "ruff format --check --diff .",
    "ruff check .",
]
fix = [
    "ruff format .",
    "ruff check --fix .",
]
